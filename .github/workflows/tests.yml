name: Cross-platform tests

on:
  push:
    branches: [master, main, feat/macos-launchagent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install --no-cache-dir ".[dev]"
      - name: Check changed Python files
        run: python -m ruff check src/bbwatch/launchagent.py src/bbwatch/cli.py tests/test_launchagent.py scripts/run_ci_tests.py
      - name: Run complete offline test suite and clean up
        env:
          BBWATCH_TEST_REPORT: ${{ runner.temp }}/bbwatch-test-results.xml
        run: python scripts/run_ci_tests.py
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/bbwatch-test-results.xml
          if-no-files-found: ignore
          retention-days: 3
