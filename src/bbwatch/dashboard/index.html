<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="bbwatch 学习清单：整理 Blackboard 作业、截止时间与批改进度。"
    />
    <meta name="color-scheme" content="light dark" />
    <title>bbwatch · 课程任务</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2210%22%20fill%3D%22%2334594d%22/%3E%3Cg%20transform%3D%22translate%288%208%29%22%20fill%3D%22none%22%20stroke%3D%22%23f7f8f5%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%205C9%203%206%203%203%204v15c3-1%206-1%209%201%203-2%206-2%209-1V4c-3-1-6-1-9%201Zm0%200v15%22/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      (function () {
        let theme;
        try {
          theme = localStorage.getItem("bbwatch-theme");
        } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --canvas: #f7f8f5;
        --surface: #fff;
        --soft: #eef1ed;
        --hover: #f5f7f3;
        --text: #242c28;
        --muted: #656e68;
        --faint: #69726c;
        --line: #e3e8e1;
        --accent: #34594d;
        --accent-soft: #e9f0e9;
        --accent-text: #34594d;
        --danger: #ad5148;
        --danger-soft: #f8eeeb;
        --amber: #926224;
        --amber-soft: #f7f0e3;
        --button: #2b4036;
        --button-text: #fff;
        --focus: #47735f;
        --sans:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        --serif: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --canvas: #171c19;
        --surface: #1d2420;
        --soft: #242e27;
        --hover: #232b25;
        --text: #e8ede5;
        --muted: #a6b1a8;
        --faint: #909e93;
        --line: #323d34;
        --accent: #b2cab6;
        --accent-soft: #2a3a2e;
        --accent-text: #bed4c2;
        --danger: #e3a298;
        --danger-soft: #382a27;
        --amber: #d9bb84;
        --amber-soft: #353024;
        --button: #c9d9c8;
        --button-text: #203328;
        --focus: #c0d7c4;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--canvas);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      button,
      a,
      summary {
        touch-action: manipulation;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip {
        position: fixed;
        left: 20px;
        top: -80px;
        z-index: 5;
        padding: 12px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .skip:focus {
        top: 12px;
      }
      .wrap {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: 0 36px;
      }
      .top {
        min-height: 100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--accent);
        color: var(--canvas);
      }
      .brand-mark svg {
        width: 20px;
        height: 20px;
      }
      .brand-name {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.7px;
      }
      .brand-caption {
        border-left: 1px solid var(--line);
        margin-left: 8px;
        padding-left: 20px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .portal {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        min-height: 44px;
        padding: 0 8px;
      }
      .portal:hover {
        color: var(--accent);
      }
      .icon {
        width: 18px;
        height: 18px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--soft);
      }
      .scan {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 44px;
        border: 1px solid transparent;
        padding: 0 17px;
        border-radius: 8px;
        background: var(--button);
        color: var(--button-text);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: 0.02em;
      }
      .scan:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      .spin .icon {
        animation: spin 1.2s linear infinite;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        margin: 58px 0 38px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .eyebrow::before {
        content: "";
        width: 18px;
        height: 1px;
        background: var(--accent);
      }
      h1 {
        font-size: clamp(32px, 4vw, 42px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1.35;
        margin: 0;
      }
      .intro {
        margin: 12px 0 0;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .metrics {
        display: flex;
        align-items: baseline;
        gap: 36px;
        margin: 0;
        padding: 0 4px 0 24px;
      }
      .metric {
        display: flex;
        flex-direction: column-reverse;
        gap: 6px;
      }
      .metric dt {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .metric dd {
        margin: 0;
        font-family: var(--serif);
        font-size: 42px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.05em;
        font-variant-numeric: tabular-nums;
      }
      .metric:first-child dd {
        font-size: 64px;
        color: var(--accent);
      }
      .deadline {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 21px 24px;
        background: var(--accent-soft);
        border-radius: 10px;
        margin-bottom: 32px;
      }
      .deadline-symbol {
        color: var(--accent);
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        opacity: 0.8;
      }
      .deadline-label {
        margin: 0 0 2px;
        color: var(--accent-text);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .deadline-name {
        font-size: 14px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .deadline-name span {
        font-size: 12px;
        margin-right: 10px;
        color: var(--accent-text);
        font-weight: 400;
      }
      .deadline-time {
        text-align: right;
        color: var(--accent-text);
        font-size: 16px;
        white-space: nowrap;
        font-weight: 500;
      }
      .deadline-time small {
        display: block;
        font-size: 11px;
        font-weight: 400;
        opacity: 0.85;
        margin-top: 2px;
      }
      .notice {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 24px;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
      }
      .notice.error {
        color: var(--danger);
        background: var(--danger-soft);
        border-color: transparent;
      }
      .notice.warning {
        color: var(--amber);
        background: var(--amber-soft);
        border-color: transparent;
      }
      .notice-text {
        flex: 1;
      }
      .text-btn {
        background: none;
        border: 0;
        color: inherit;
        padding: 6px 4px;
        min-height: 36px;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 4px;
        white-space: nowrap;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0 0 15px;
      }
      .section-heading h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 14px;
        font-weight: 550;
        letter-spacing: 0.025em;
      }
      .count {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-width: 24px;
        height: 23px;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--soft);
        color: var(--muted);
        font-size: 11px;
        font-family: var(--mono);
        font-weight: 400;
      }
      .sort-label {
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .list {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 12px;
        overflow: hidden;
      }
      .task {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 135px 112px 32px;
        align-items: center;
        gap: 18px;
        min-height: 102px;
        padding: 21px 23px;
      }
      .task + .task {
        border-top: 1px solid var(--line);
      }
      .task:hover {
        background: var(--hover);
      }
      .task.is-saving {
        background: var(--hover);
      }
      .task .main {
        min-width: 0;
      }
      .name {
        display: block;
        width: fit-content;
        max-width: 100%;
        font-size: 15px;
        font-weight: 520;
        line-height: 1.5;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .name:hover {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .meta {
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 11px;
      }
      .chip {
        max-width: 100%;
        overflow-wrap: anywhere;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.65;
        letter-spacing: 0.01em;
      }
      .meta-note {
        font-size: 11px;
        color: var(--muted);
      }
      .due {
        font-size: 12px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .due small {
        display: block;
        font-size: 11px;
        margin-top: 3px;
        color: var(--faint);
      }
      .status {
        justify-self: start;
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 11px;
        line-height: 1.5;
        font-weight: 400;
        color: var(--muted);
        background: var(--soft);
        white-space: nowrap;
      }
      .ov .status {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .ur .status,
      .soon .status {
        color: var(--amber);
        background: var(--amber-soft);
      }
      .status small {
        display: block;
        font-size: 10px;
      }
      .pending .status {
        color: var(--accent-text);
        background: var(--accent-soft);
      }
      .check {
        appearance: none;
        width: 36px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        color: var(--muted);
        background: transparent;
      }
      .check-shape {
        width: 22px;
        height: 22px;
        border: 1.3px solid var(--line);
        border-color: var(--faint);
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .check:hover .check-shape {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .check .icon {
        width: 13px;
        height: 13px;
        opacity: 0;
        stroke-width: 2.4;
      }
      .check[aria-checked="true"] .check-shape {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--canvas);
      }
      .check[aria-checked="true"] .icon {
        opacity: 1;
      }
      .row-symbol {
        display: grid;
        place-items: center;
        width: 36px;
        color: var(--faint);
      }
      .row-symbol .icon {
        width: 19px;
        height: 19px;
      }
      .done .name {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--faint);
      }
      .del {
        width: 32px;
        min-height: 44px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--faint);
        display: grid;
        place-items: center;
        border-radius: 5px;
      }
      .del .icon {
        width: 16px;
        height: 16px;
      }
      .del:hover {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .restore {
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 44px;
        background: none;
        border: 0;
        color: var(--accent);
        font-size: 12px;
        padding: 0;
      }
      .restore .icon {
        width: 15px;
        height: 15px;
      }
      .task.hidden-task {
        grid-template-columns: 36px minmax(0, 1fr) 135px 112px;
      }
      .groups {
        margin-top: 25px;
      }
      .disclosure {
        border-bottom: 1px solid var(--line);
      }
      .disclosure summary {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 65px;
        padding: 16px 2px;
        list-style: none;
        font-size: 13px;
        color: var(--muted);
      }
      .disclosure summary::-webkit-details-marker {
        display: none;
      }
      .disclosure summary .icon {
        width: 15px;
        height: 15px;
        transition: transform 0.18s ease;
      }
      .disclosure[open] summary .icon {
        transform: rotate(90deg);
      }
      .disclosure summary .count {
        margin-left: auto;
        background: transparent;
      }
      .disclosure summary:hover {
        color: var(--text);
      }
      .disclosure .list {
        margin: 0 0 20px;
      }
      .empty {
        padding: 48px 24px 46px;
        text-align: center;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 12px;
      }
      .empty-symbol {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: var(--accent);
        background: var(--accent-soft);
      }
      .empty h3 {
        margin: 0 0 8px;
        font-weight: 500;
        font-size: 17px;
      }
      .empty p {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }
      .empty .scan {
        margin-top: 22px;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin: 34px 0 38px;
        color: var(--faint);
        font-size: 11px;
      }
      .foot-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .foot-left::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--muted);
      }
      .demo-label {
        padding: 1px 6px;
        color: var(--amber);
        background: var(--amber-soft);
        border-radius: 4px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 10px);
        max-width: calc(100% - 32px);
        padding: 12px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--text);
        color: var(--canvas);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        z-index: 4;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .skeleton {
        min-height: 98px;
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 20px 24px;
      }
      .skeleton + .skeleton {
        border-top: 1px solid var(--line);
      }
      .skeleton-circle {
        width: 22px;
        height: 22px;
        background: var(--soft);
        border-radius: 50%;
      }
      .skeleton-lines {
        flex: 1;
      }
      .skeleton-lines::before,
      .skeleton-lines::after {
        content: "";
        display: block;
        height: 10px;
        width: 38%;
        border-radius: 3px;
        background: var(--soft);
      }
      .skeleton-lines::after {
        width: 22%;
        margin-top: 12px;
        height: 7px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 800px) {
        .wrap {
          padding: 0 24px;
        }
        .brand-caption,
        .portal {
          display: none;
        }
        .hero {
          margin: 40px 0 30px;
          gap: 20px;
        }
        .metrics {
          gap: 24px;
          padding: 0;
        }
        .metric dd {
          font-size: 32px;
        }
        .metric:first-child dd {
          font-size: 48px;
        }
        .task {
          grid-template-columns: 32px minmax(0, 1fr) 100px 28px;
          gap: 12px;
          padding: 19px 18px;
        }
        .task .due {
          display: none;
        }
        .task .meta .mobile-date {
          display: inline;
        }
        .task.hidden-task {
          grid-template-columns: 32px minmax(0, 1fr) 80px;
        }
        .task.hidden-task .due {
          display: none;
        }
      }
      @media (min-width: 801px) {
        .mobile-date {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .wrap {
          padding: 0 18px;
        }
        .top {
          min-height: 82px;
          gap: 12px;
        }
        .brand {
          gap: 9px;
        }
        .brand-name {
          font-size: 18px;
        }
        .brand-mark {
          width: 30px;
          height: 30px;
          border-radius: 8px;
        }
        .controls {
          gap: 8px;
        }
        .scan {
          padding: 0 12px;
          font-size: 12px;
        }
        .icon-btn {
          width: 40px;
        }
        .hero {
          display: block;
          margin: 32px 0 25px;
        }
        h1 {
          font-size: 32px;
        }
        .intro {
          font-size: 12px;
          margin-top: 8px;
        }
        .metrics {
          margin-top: 28px;
          justify-content: flex-start;
          gap: 40px;
        }
        .metric:first-child dd {
          font-size: 46px;
        }
        .metric dd {
          font-size: 34px;
        }
        .metric dt {
          font-size: 10px;
        }
        .deadline {
          padding: 16px;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 12px;
          margin-bottom: 26px;
        }
        .deadline-symbol {
          display: none;
        }
        .deadline-name {
          font-size: 12px;
        }
        .deadline-name span {
          display: block;
          font-size: 10px;

        .empty {

        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {

          scroll-behavior: auto !important;

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"

    <script>
      let STATE = null;
      let SCAN_ACTIVE = false;
      let LOAD_SEQUENCE = 0;
      let LOAD_ERROR = false;
      let scanTimer = null;
      let watchedScanId = null;
      let scanWaitStarted = null;
      let expiredScanId = null;
      let changedScanStatus = null;
      let scanNotice = "";
      let scanNoticeKind = "warning";
      let scanPollInFlight = false;
      let scanRequestPending = false;
      let pageActive = true;
      const SCAN_WAIT_LIMIT = 16 * 60000;
      const SAVING = new Set();
      const OPEN_GROUPS = new Set();
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const icon = (name) =>
        `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const count = (n) => String(n).padStart(2, "0");
      function parseUTC(s) {
        if (!s) return null;
        const d = new Date(s);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      function fmt(due) {
        if (!due || Number.isNaN(due.getTime())) return "未设置截止时间";
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        })
          .format(due)
          .replace(/\//g, "/");
      }
      function courseShort(c) {
        const s = String(c || "");
        const m = s.match(/^[A-Z]{2,5}\d{3,4}[A-Z]?/);
        return m ? m[0] : s.split(":")[0] || "未分类课程";
      }
      function classify(due, now) {
        if (!due) return "calm";
        const h = (due - now) / 3600000;
        return h < 0 ? "ov" : h <= 24 ? "ur" : h <= 72 ? "soon" : "calm";
      }
      function rel(due, now) {
        if (!due) return { n: "时间待定", u: "" };
        const hours = (due - now) / 3600000;
        const h = Math.abs(hours);
        let n =
          h < 1
            ? `${Math.max(1, Math.ceil(h * 60))}分钟`
            : h < 48
              ? `${Math.ceil(h)}小时`
              : `${Math.ceil(h / 24)}天`;
        return { n, u: hours < 0 ? "已逾期" : "后截止" };
      }
      function deadlineStatus(due, now) {
        if (!due) return "时间待定";
        const r = rel(due, now);
        return due < now ? `逾期 ${r.n}` : `${r.n}后截止`;
      }
      function elapsedSince(date, now) {
        const seconds = Math.max(0, (now - date) / 1000);
        if (seconds < 60) return "刚刚";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}分钟前`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}小时前`;
        return `${Math.floor(seconds / 86400)}天前`;
      }
      function themeNow() {
        return document.documentElement.getAttribute("data-theme") || "light";
      }
      function setThemeIcon() {
        const b = $("#themeBtn");
        b.innerHTML = icon(themeNow() === "dark" ? "sun" : "moon");
        const label =
          themeNow() === "dark" ? "切换到日间主题" : "切换到夜间主题";
        b.setAttribute("aria-label", label);
        b.title = label;
      }
      function toggleTheme() {
        const t = themeNow() === "dark" ? "light" : "dark";
        try {
          localStorage.setItem("bbwatch-theme", t);
        } catch (_) {}
        document.documentElement.setAttribute("data-theme", t);
        setThemeIcon();
      }
      const BBHOST = "https://bb.cuhk.edu.cn";
      function jumpUrl(t) {
        const cid =
          t.course_id || String(t.entity_key || "").split(":")[1] || "";
        const c = encodeURIComponent(cid);
        return t.content_id
          ? `${BBHOST}/webapps/assignment/uploadAssignment?content_id=${encodeURIComponent(t.content_id)}&course_id=${c}&mode=view`
          : `${BBHOST}/webapps/gradebook/do/student/viewGrades?course_id=${c}`;
      }
      function rowMain(t) {
        const due = parseUTC(t.due_utc);
        return `<div class="main"><a class="name" data-focus="link:${esc(t.entity_key)}" href="${esc(jumpUrl(t))}" target="_blank" rel="noopener noreferrer" title="在 Blackboard 查看：${esc(t.name)}">${esc(t.name)}</a><div class="meta"><span class="chip" title="${esc(t.course || t.course_id)}">${esc(courseShort(t.course || t.course_id))}</span><span class="meta-note mobile-date">${esc(fmt(due))}</span></div></div>`;
      }
      function rowDate(t) {
        const due = parseUTC(t.due_utc);
        if (!due)
          return '<div class="due">时间待定<small>未设置截止日期</small></div>';
        const parts = fmt(due).split(" ");
        return `<div class="due">${esc(parts[0])}<small>${esc(parts.slice(1).join(" "))} 截止</small></div>`;
      }
      function hideButton(t) {
        return `<button class="del" type="button" data-action="hide" data-key="${esc(t.entity_key)}" data-focus="hide:${esc(t.entity_key)}" title="隐藏此任务，可在已隐藏中恢复" aria-label="隐藏 ${esc(t.name)}" ${SAVING.has(t.entity_key) ? "disabled" : ""}>${icon("trash")}</button>`;
      }
      function taskRow(t, i) {
        const due = parseUTC(t.due_utc);
        const status = t.done ? "已完成" : deadlineStatus(due, Date.now());
        return `<article class="task ${t.done ? "done" : classify(due, Date.now())} ${SAVING.has(t.entity_key) ? "is-saving" : ""}"><button class="check" type="button" role="checkbox" aria-checked="${!!t.done}" aria-label="${t.done ? "标记未完成" : "标记完成"}：${esc(t.name)}" data-action="done" data-key="${esc(t.entity_key)}" data-done="${!t.done}" data-focus="done:${esc(t.entity_key)}" ${SAVING.has(t.entity_key) ? "disabled" : ""}><span class="check-shape">${icon("check")}</span></button>${rowMain(t)}${rowDate(t)}<span class="status">${esc(status)}</span>${hideButton(t)}</article>`;
      }
      function pendingRow(t, i) {
        const waited = Number.isFinite(t.waited_days)
          ? `${t.waited_days}天待批改`
          : "等待批改";
        return `<article class="task pending ${SAVING.has(t.entity_key) ? "is-saving" : ""}"><span class="row-symbol">${icon("clock")}</span>${rowMain(t)}${rowDate(t)}<span class="status" title="${t.waited_days >= 14 ? "已等待较久，可向老师确认批改进度" : "已提交，等待老师批改"}">${esc(waited)}${t.waited_days >= 14 ? "<small>可向老师确认</small>" : ""}</span>${hideButton(t)}</article>`;
      }
      function hiddenRow(t, i) {
        return `<article class="task hidden-task ${SAVING.has(t.entity_key) ? "is-saving" : ""}"><span class="row-symbol">${icon("trash")}</span>${rowMain(t)}${rowDate(t)}<button class="restore" type="button" data-action="restore" data-key="${esc(t.entity_key)}" data-focus="restore:${esc(t.entity_key)}" aria-label="恢复 ${esc(t.name)}" ${SAVING.has(t.entity_key) ? "disabled" : ""}>${icon("restore")}恢复</button></article>`;
      }
      function group(id, label, items, row) {
        if (!items.length) return "";
        return `<details class="disclosure" id="${id}" ${OPEN_GROUPS.has(id) ? "open" : ""}><summary>${icon("chevron")}<span>${label}</span><span class="count">${count(items.length)}</span></summary><div class="list">${items.map(row).join("")}</div></details>`;
      }
      function notice(message, kind = "error", retry = true) {
        const box = $("#notice");
        box.className = `notice ${kind}`;
        box.hidden = !message;
        $("#noticeText").textContent = message;
        $("#retryBtn").hidden = !retry;
      }
      function restoreFocus(focusKey) {
        const target = Array.from(
          document.querySelectorAll("[data-focus]"),
        ).find((el) => el.getAttribute("data-focus") === focusKey);
        if (target && !target.disabled) {
          const parent = target.closest("details");
          if (parent) {
            parent.open = true;
            OPEN_GROUPS.add(parent.id);
          }
          target.focus({ preventScroll: true });
        } else if (!target) $("#boardHeading")?.focus({ preventScroll: true });
      }
      function render() {
        if (!STATE) return;
        for (const d of document.querySelectorAll("details.disclosure")) {
          if (d.open) OPEN_GROUPS.add(d.id);
          else OPEN_GROUPS.delete(d.id);
        }
        const active = document.activeElement;
        const focusKey = active?.getAttribute?.("data-focus");
        const focusSummary =
          active?.tagName === "SUMMARY" ? active.parentElement?.id : null;
        const now = Date.now(),
          tasks = STATE.tasks.slice();
        const dateOrder = (t) => parseUTC(t.due_utc)?.getTime() ?? Infinity;
        const todo = tasks
          .filter((t) => !t.done)
          .sort((a, b) => dateOrder(a) - dateOrder(b));
        const done = tasks
          .filter((t) => t.done)
          .sort((a, b) => dateOrder(b) - dateOrder(a));
        const pend = STATE.pending || [],
          hidden = STATE.hidden || [];
        $("#metrics").innerHTML = [
          ["待完成", todo.length],
          ["待批改", pend.length],
          ["已完成", done.length],
        ]
          .map(
            ([name, n]) =>
              `<div class="metric"><dt>${name}</dt><dd>${count(n)}</dd></div>`,
          )
          .join("");
        const next =
          todo.find((t) => dateOrder(t) >= now && dateOrder(t) !== Infinity) ||
          todo[0];
        const focus = $("#deadline");
        focus.hidden = !next;
        if (next) {
          const due = parseUTC(next.due_utc);
          const label = due && due < now ? "优先关注" : "下一项截止";
          focus.setAttribute("aria-label", label);
          focus.innerHTML = `<span class="deadline-symbol">${icon("calendar")}</span><div><p class="deadline-label">${label}</p><div class="deadline-name"><span>${esc(courseShort(next.course || next.course_id))}</span>${esc(next.name)}</div></div><div class="deadline-time">${esc(deadlineStatus(due, now))}<small>${esc(fmt(due))}</small></div>`;
        }
        const last = parseUTC(STATE.last_scan);
        const stale = last && now - last > 12 * 3600000;
        let html = `<div class="section-heading"><h2 id="boardHeading" tabindex="-1">待完成<span class="count">${count(todo.length)}</span></h2><span class="sort-label">按截止时间排序</span></div>`;
        if (todo.length)
          html += `<div class="list">${todo.map(taskRow).join("")}</div>`;
        else if (!STATE.last_scan)
          html += `<div class="empty"><span class="empty-symbol">${icon("calendar")}</span><h3>从第一次同步开始</h3><p>扫描 Blackboard，将课程与作业整理到这里。</p><button class="scan" type="button" data-action="scan" ${SCAN_ACTIVE ? "disabled" : ""}>${icon("refresh")}${SCAN_ACTIVE ? "扫描中" : "扫描课程"}</button></div>`;
        else
          html += `<div class="empty"><span class="empty-symbol">${icon("check")}</span><h3>暂时没有待完成的作业</h3><p>${stale ? "当前缓存中没有待完成的作业，请扫描确认最新情况。" : pend.length ? "已提交的作业，可以在下方查看批改进度。" : "清单已整理好，留一点时间给自己。"}</p></div>`;
        html += `<div class="groups">${group("pw", "已提交 · 待批改", pend, pendingRow)}${group("dw", "已完成", done, taskRow)}${group("hw", "已隐藏", hidden, hiddenRow)}</div>`;
        $("#board").innerHTML = html;
        $("#board").setAttribute("aria-busy", "false");
        $("#lastScan").textContent = last
          ? `上次扫描 · ${elapsedSince(last, now)}`
          : "尚未扫描";
        $("#demoLabel").hidden = !STATE.demo;
        if (!LOAD_ERROR) {
          if (scanNotice) notice(scanNotice, scanNoticeKind, !SCAN_ACTIVE);
          else if (stale)
            notice(
              "清单超过 12 小时未更新；当前记录可能不完整，建议扫描一次。",
              "warning",
              false,
            );
          else notice("");
        }
        if (focusKey) restoreFocus(focusKey);
        else if (focusSummary) {
          document
            .getElementById(focusSummary)
            ?.querySelector("summary")
            ?.focus({ preventScroll: true });
        }
      }
      async function request(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        try {
          const response = await fetch(url, {
            ...options,
            signal: controller.signal,
          });
          if (!response.ok) throw new Error("请求未能完成");
          const data = await response.json();
          if (options.method === "POST" && data.ok !== true) {
            const error = new Error("操作未能保存");
            error.responseData = data;
            throw error;
          }
          return data;
        } finally {
          clearTimeout(timeout);
        }
      }
      async function load() {
        const seq = ++LOAD_SEQUENCE;
        try {
          const data = await request("/api/tasks", { cache: "no-store" });
          if (
            !data ||
            !["tasks", "pending", "hidden"].every(
              (group) =>
                Array.isArray(data[group]) &&
                data[group].every(
                  (row) =>
                    row &&
                    typeof row === "object" &&
                    !Array.isArray(row) &&
                    typeof row.entity_key === "string" &&
                    row.entity_key.length > 0 &&
                    typeof row.name === "string",
                ),
            )
          )
            throw new Error("清单暂不可用");
          if (seq !== LOAD_SEQUENCE) return false;
          STATE = data;
          LOAD_ERROR = false;
          if (!scanRequestPending) syncScanStatus(data.scan);
          render();
          return true;
        } catch (_) {
          if (seq !== LOAD_SEQUENCE) return false;
          LOAD_ERROR = true;
          notice(
            STATE
              ? "连接暂时中断，当前显示上次读取的清单。"
              : "暂时无法连接看板，请确认本机 bbwatch 看板仍在运行。",
          );
          if (!STATE) {
            $("#board").setAttribute("aria-busy", "false");
            $("#board").innerHTML =
              `<div class="empty"><span class="empty-symbol">${icon("restore")}</span><h3>清单暂时无法载入</h3><p>重新连接后，你的课程任务会出现在这里。</p></div>`;
            $("#lastScan").textContent = "连接暂不可用";
          }
          return false;
        }
      }
      async function mutate(path, key, payload, message) {
        if (!STATE || SAVING.has(key)) return;
        const active = document.activeElement;
        const focusKey =
          active?.getAttribute?.("data-key") === key
            ? active.getAttribute("data-focus")
            : null;
        SAVING.add(key);
        render();
        try {
          await request(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ entity_key: key, ...payload }),
          });
          if (await load()) toast(message);
          else toast("操作已保存，清单暂时无法刷新，请重新连接。");
        } catch (_) {
          toast("操作未能确认，请重试。清单未作更改。");
        } finally {
          SAVING.delete(key);
          const activeNow = document.activeElement;
          const shouldRestore =
            focusKey &&
            (!activeNow ||
              activeNow === document.body ||
              activeNow.getAttribute?.("data-focus") === focusKey);
          render();
          if (shouldRestore) {
            const destination = STATE.hidden.some((t) => t.entity_key === key)
              ? `restore:${key}`
              : STATE.pending.some((t) => t.entity_key === key)
                ? `link:${key}`
                : focusKey.startsWith("restore:")
                  ? `link:${key}`
                  : focusKey;
            restoreFocus(destination);
          }
        }
      }
      async function toggle(key, done) {
        await mutate(
          "/api/done",
          key,
          { done },
          done ? "已标记完成，可在“已完成”中撤销。" : "已恢复为待完成。",
        );
      }
      async function hide(key, h) {
        await mutate(
          "/api/hide",
          key,
          { hidden: h },
          h ? "已隐藏，可在“已隐藏”中恢复。" : "已恢复到任务清单。",
        );
      }
      function setScanBusy(busy) {
        SCAN_ACTIVE = busy;
        const b = $("#scanBtn");
        b.disabled = busy;
        b.classList.toggle("spin", busy);
        b.setAttribute("aria-busy", String(busy));
        $("#scanTxt").textContent = busy ? "扫描中" : "扫描更新";
        for (const button of document.querySelectorAll(
          '[data-action="scan"]',
        )) {
          button.disabled = busy;
          button.innerHTML = `${icon("refresh")}${busy ? "扫描中" : "扫描课程"}`;
          button.setAttribute("aria-busy", String(busy));
        }
      }
      function validScanStatus(scan) {
        return (
          scan &&
          ["idle", "running", "succeeded", "partial", "failed"].includes(scan.state) &&
          (scan.state === "idle" || scan.state === "failed" ||
            (typeof scan.id === "string" && scan.id.length > 0))
        );
      }
      function stopScanPolling() {
        clearTimeout(scanTimer);
        scanTimer = null;
      }
      function scanWaitExpired() {
        if (scanWaitStarted === null || Date.now() - scanWaitStarted < SCAN_WAIT_LIMIT)
          return false;
        expiredScanId = watchedScanId;
        stopScanPolling();
        setScanBusy(false);
        scanNotice = "等待扫描结果已超过 16 分钟，暂时无法确认是否完成。清单会定期重新连接，也可点击重新连接查看。";
        scanNoticeKind = "warning";
        notice(scanNotice, scanNoticeKind);
        return true;
      }
      function scheduleScanPoll() {
        if (!SCAN_ACTIVE || scanTimer !== null || scanPollInFlight ||
            !pageActive || document.hidden) return;
        scanTimer = setTimeout(async () => {
          scanTimer = null;
          if (!SCAN_ACTIVE || !pageActive || document.hidden || scanWaitExpired()) return;
          scanPollInFlight = true;
          try {
            await load();
          } finally {
            scanPollInFlight = false;
            scheduleScanPoll();
          }
        }, 3000);
      }
      function syncScanStatus(scan) {
        if (!validScanStatus(scan)) {
          stopScanPolling();
          setScanBusy(false);
          scanNotice = "当前看板服务未提供扫描状态。请重启本机 bbwatch 看板，再查看或发起扫描。";
          scanNoticeKind = "warning";
          return;
        }
        const statusKey = `${scan.state}:${scan.id ?? ""}`;
        // Adopt the latest running operation; a different terminal record cannot
        // establish how the previously watched operation ended.
        if (watchedScanId && scan.id !== watchedScanId && scan.state !== "running") {
          stopScanPolling();
          setScanBusy(false);
          watchedScanId = null;
          scanWaitStarted = null;
          expiredScanId = null;
          changedScanStatus = statusKey;
          scanNotice = "扫描记录已变化，之前结果无法确认；当前显示最新清单。";
          scanNoticeKind = "warning";
          return;
        }
        if (scan.state === "running") {
          if (scan.id === expiredScanId) return;
          changedScanStatus = null;
          if (watchedScanId !== scan.id || scanWaitStarted === null) {
            watchedScanId = scan.id;
            scanWaitStarted = Date.now();
          }
          if (!pageActive) return;
          setScanBusy(true);
          scanNotice = `${scan.message || "正在扫描课程。"} 清单会自动更新，下方保留上次读取的记录。`;
          scanNoticeKind = "warning";
          if (!scanWaitExpired()) scheduleScanPoll();
          return;
        }
        const completedRequest = watchedScanId && scan.id === watchedScanId;
        stopScanPolling();
        setScanBusy(false);
        watchedScanId = null;
        scanWaitStarted = null;
        expiredScanId = null;
        if (changedScanStatus === statusKey) return;
        changedScanStatus = null;
        scanNotice = scan.state === "failed"
          ? scan.message || "扫描未能完成，请检查登录状态后重试。"
          : scan.state === "partial"
            ? scan.message || "扫描部分完成，仍有课程无法读取，请稍后重试。"
            : "";
        scanNoticeKind = scan.state === "failed" ? "error" : "warning";
        if (completedRequest && scan.state === "succeeded")
          toast(scan.message || "扫描已完成，清单已更新。");
      }
      async function doScan() {
        if (SCAN_ACTIVE) return;
        if (STATE && !validScanStatus(STATE.scan)) {
          syncScanStatus(STATE.scan);
          notice(scanNotice, scanNoticeKind);
          return;
        }
        setScanBusy(true);
        scanRequestPending = true;
        try {
          const result = await request("/api/scan", { method: "POST" });
          watchedScanId = null;
          scanWaitStarted = null;
          expiredScanId = null;
          syncScanStatus(result.scan);
        } catch (error) {
          stopScanPolling();
          setScanBusy(false);
          if (validScanStatus(error.responseData?.scan))
            syncScanStatus(error.responseData.scan);
          else {
            scanNotice = "暂时无法确认扫描请求，请稍后重新连接查看；当前清单未作更改。";
            scanNoticeKind = "error";
          }
        } finally {
          scanRequestPending = false;
          if (scanNotice) notice(scanNotice, scanNoticeKind, !SCAN_ACTIVE);
        }
      }
      function toast(message) {
        const t = $("#toast");
        t.textContent = message;
        t.className = "toast show";
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
          t.className = "toast";
        }, 4200);
      }
      $("#themeBtn").addEventListener("click", toggleTheme);
      $("#scanBtn").addEventListener("click", doScan);
      $("#retryBtn").addEventListener("click", load);
      $("#board").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button || button.disabled) return;
        const key = button.dataset.key;
        if (button.dataset.action === "done")
          toggle(key, button.dataset.done === "true");
        else if (button.dataset.action === "hide") hide(key, true);
        else if (button.dataset.action === "restore") hide(key, false);
        else if (button.dataset.action === "scan") doScan();
      });
      setThemeIcon();
      load();
      setInterval(async () => {
        if (pageActive && !document.hidden) await load();
      }, 60000);
      window.addEventListener("pagehide", () => {
        pageActive = false;
        stopScanPolling();
        setScanBusy(false);
      });
      window.addEventListener("pageshow", (event) => {
        pageActive = true;
        if (event.persisted) {
          load();
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopScanPolling();
        else if (pageActive) load();
      });
    </script>
  </body>
</html>
